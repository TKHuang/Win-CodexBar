name: Release

# Tag-triggered release: build → SignPath sign → approval → draft publish.
#
# This workflow used to only POST to the CircleCI API, and CircleCI owned the
# release build. SignPath's Trusted Build System integration verifies build
# provenance through GitHub (`github-artifact-id`), so signing requires the
# artifacts to be produced by this workflow. The CircleCI `release` workflow in
# `.circleci/config.yml` is now dormant: the project's trigger configuration
# excludes tag pushes (see `.github/CI.md`), and nothing calls the API anymore.
#
# The two-job split preserves the property CircleCI enforced — the job that
# builds the binaries never holds a publish credential. Only `publish` receives
# `GH_TOKEN`, and it is gated on the `release` environment.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build and sign release artifacts
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Job-level so every step's `if:` can read it. The `secrets` context is
      # not available in a step `if:`, which is why this is indirected here.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signpath.conclusion == 'success' }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          # release-preflight.ps1 validates protected `main` ancestry, which
          # needs the full history, not a shallow clone.
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve tag commit SHA
        id: tag-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare version (strip v prefix)
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert the build job holds no publish credential
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'GH_TOKEN must be absent from the credential-free build job.'
          }
          Write-Host '[ok] no GH_TOKEN in the build environment'

      - name: Install release prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/install-release-prerequisites.ps1 -RepoRoot .
          if ($LASTEXITCODE -ne 0) { throw "install-release-prerequisites failed: $LASTEXITCODE" }

      - name: Release preflight
        shell: pwsh
        env:
          CIRCLE_TAG: ${{ github.ref_name }}
          CIRCLE_SHA1: ${{ steps.tag-sha.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/release-preflight.ps1 -Tag $env:CIRCLE_TAG -Sha $env:CIRCLE_SHA1 -RepoRoot .
          if ($LASTEXITCODE -ne 0) { throw "release-preflight failed: $LASTEXITCODE" }

      - name: Build release artifacts
        shell: pwsh
        env:
          CIRCLE_TAG: ${{ github.ref_name }}
          CIRCLE_SHA1: ${{ steps.tag-sha.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/circleci-release-build.ps1 -Tag $env:CIRCLE_TAG -Sha $env:CIRCLE_SHA1 -RepoRoot .
          if ($LASTEXITCODE -ne 0) { throw "circleci-release-build failed: $LASTEXITCODE" }

      - name: Upload unsigned installers for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-unsigned-${{ github.ref_name }}
          path: release-output/CodexBar-*.exe
          if-no-files-found: error

      # Skipped while SignPath onboarding is incomplete: without the token the
      # workflow publishes unsigned artifacts with SHA-256 sidecars, exactly as
      # the CircleCI pipeline did. See docs/CODE_SIGNING.md.
      - name: Submit to SignPath for code signing
        id: signpath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: codexbar-installer
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Replace unsigned installers and recompute hashes
        if: ${{ steps.signpath.conclusion == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $outputDir = 'release-output'
          $signedDir = 'release-signed'
          $replaced = 0
          foreach ($name in @("CodexBar-$version-Setup.exe", "CodexBar-$version-portable.exe")) {
            $signedPath = Join-Path $signedDir $name
            $outputPath = Join-Path $outputDir $name
            if (Test-Path $signedPath) {
              Copy-Item $signedPath $outputPath -Force
              $hash = (Get-FileHash -Algorithm SHA256 $outputPath).Hash.ToLower()
              "$hash  $name" | Set-Content -Encoding ascii "$outputPath.sha256"
              Write-Host "[ok] signed: $name ($hash)"
              $replaced++
            } else {
              Write-Host "[warn] no signed build returned, keeping unsigned: $name"
            }
          }
          if ($replaced -eq 0) {
            throw 'SignPath reported success but returned no signed installers.'
          }
          # release-manifest.json carries the hashes publish-github-release.ps1
          # verifies, so it has to follow the signed bytes.
          $manifestPath = Join-Path $outputDir 'release-manifest.json'
          if (Test-Path $manifestPath) {
            $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            foreach ($asset in $manifest.assets) {
              $assetPath = Join-Path $outputDir $asset.name
              if (Test-Path $assetPath) {
                $asset.sha256 = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLower()
                $asset.bytes = (Get-Item -LiteralPath $assetPath).Length
                Write-Host "[ok] manifest hash updated for $($asset.name)"
              }
            }
            $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding UTF8
          }

      - name: Verify Authenticode signature
        if: ${{ steps.signpath.conclusion == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          foreach ($name in @("CodexBar-$version-Setup.exe", "CodexBar-$version-portable.exe")) {
            $path = Join-Path 'release-output' $name
            if (-not (Test-Path $path)) { continue }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            Write-Host "$name -> $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              throw "$name is not validly signed: $($sig.Status)"
            }
          }

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-release-${{ github.ref_name }}
          path: release-output/
          if-no-files-found: error

  publish:
    name: Publish draft GitHub release
    needs: build
    runs-on: windows-latest
    # Configure required reviewers on this environment in repo Settings →
    # Environments to reproduce the manual hold the CircleCI `release-approval`
    # job provided. Without reviewers the job runs unattended.
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: codexbar-release-${{ github.ref_name }}
          path: release-output

      - name: Publish assets to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path 'release-output' 'release-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Missing release manifest: $manifestPath"
          }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/publish-github-release.ps1 -AssetsDir release-output -Tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "publish-github-release failed: $LASTEXITCODE" }

      - name: Summarize
        shell: pwsh
        run: |
          $signed = '${{ needs.build.outputs.signed }}'
          $state = if ($signed -eq 'true') { 'signed via SignPath' } else { 'UNSIGNED (SignPath secrets not configured)' }
          Write-Host "::notice::Draft release ${env:GITHUB_REF_NAME} published - $state"
